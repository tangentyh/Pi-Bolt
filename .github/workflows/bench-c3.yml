name: bench-c3

# Scratch benchmark (deleted afterwards): Pi-Bolt 1.0.3 C3 (pi-bolt 7f4574e90 built by scripts/build-pi.sh on the runtimes
# of runtime.yml run 40182788459, the ones on the bolt-v1.0.3 draft) against Pi-Bolt 1.0.2 as released and PiG 0.5.3 as
# released, on ubuntu-24.04 (pinned to one CPU) and ubuntu-24.04-arm, default and -jit builds.
#   rel, rel2  pi-bolt-<platform>[-jit].tar.xz of bolt-v1.0.2 (SHA256SUMS signed by keys/release.pub); rel2 = second copy (noise)
#   cand       this tree, built on the 1.0.3 runtime (sha256 checked against the draft's asset)
#   pig        PiG 0.5.3 (SHA256SUMS and sigstore bundle)
on:
  push:
    branches: ["bench/c3-103"]

permissions:
  contents: read
  actions: read

jobs:
  bench:
    name: ${{ matrix.name }} ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86-64, runner: ubuntu-24.04, plat: linux-x64, pig: linux-amd64, variant: default, rtsha: 24ef4ceca491d908a4dc5ac6a8db4c1678abacc3fddb0f79255e0f445929f6fc }
          - { name: Linux x86-64, runner: ubuntu-24.04, plat: linux-x64, pig: linux-amd64, variant: jit, rtsha: 24ef4ceca491d908a4dc5ac6a8db4c1678abacc3fddb0f79255e0f445929f6fc }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, plat: linux-arm64, pig: linux-arm64, variant: default, rtsha: 55eca583f721c06adfb8608fc33e9d813e5c20b1098c3dd8318cce285d2adb60 }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, plat: linux-arm64, pig: linux-arm64, variant: jit, rtsha: 55eca583f721c06adfb8608fc33e9d813e5c20b1098c3dd8318cce285d2adb60 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: "40182788459"
          PLAT: ${{ matrix.plat }}
          PIG_PLAT: ${{ matrix.pig }}
          VARIANT: ${{ matrix.variant }}
          RTSHA: ${{ matrix.rtsha }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux xz-utils >/dev/null
          mkdir -p results .work
          SUFFIX=""; JIT=off; [ "$VARIANT" = jit ] && { SUFFIX=-jit; JIT=on; }
          gh release download bolt-v1.0.2 --repo "$GITHUB_REPOSITORY" --pattern "pi-bolt-$PLAT$SUFFIX.tar.xz" \
            --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir .work/rel-dl
          openssl pkeyutl -verify -pubin -inkey keys/release.pub -rawin -in .work/rel-dl/SHA256SUMS -sigfile .work/rel-dl/SHA256SUMS.sig
          [ "$(head -n 1 .work/rel-dl/SHA256SUMS)" = "# pi-bolt 1.0.2" ]
          (cd .work/rel-dl && grep -E " pi-bolt-$PLAT$SUFFIX\.tar\.xz\$" SHA256SUMS | sha256sum -c -)
          for b in rel rel2; do mkdir -p out/$b && tar -C out/$b --strip-components=1 -xJf ".work/rel-dl/pi-bolt-$PLAT$SUFFIX.tar.xz"; done
          echo "rel, rel2: pi-bolt-$PLAT$SUFFIX.tar.xz of bolt-v1.0.2 (signature and sum verified)" >>results/environment.txt
          gh run download "$RUNTIME_RUN" --repo "$GITHUB_REPOSITORY" --name "runtime-$PLAT" --dir .work/rt
          echo "$RTSHA  .work/rt/pi-bolt-runtime-$PLAT.tar.gz" | sha256sum -c -
          tar -C .work/rt -xzf ".work/rt/pi-bolt-runtime-$PLAT.tar.gz"
          mkdir -p .work/runtime && install -m 755 ".work/rt/pi-bolt-runtime-$PLAT/bun" .work/runtime/bun
          echo 4c59468c0c4b8d3f >.work/runtime/RUNTIME_STAMP
          echo "runtime: run $RUNTIME_RUN (= bolt-v1.0.3 draft asset, sha256 $RTSHA), $(.work/runtime/bun --version)" >>results/environment.txt
          scripts/prepare-pi.sh
          scripts/build-pi.sh --jit "$JIT" --out out/cand
          echo "cand: pi-bolt $(git rev-parse --short HEAD^) (tree 7f4574e90) by scripts/build-pi.sh --jit $JIT on that runtime" >>results/environment.txt
          stage=.work/cand-dl/stage/pi-bolt-$PLAT$SUFFIX
          mkdir -p "$stage" && cp -R out/cand/. "$stage/" && cp LICENSE THIRD_PARTY_NOTICES.md "$stage/" && cp LICENSE "$stage/LICENSE.pi"
          filters=(--lzma2=preset=9e); [ "$PLAT" = linux-x64 ] && filters=(--x86 "${filters[@]}")
          tar --owner=0 --group=0 --numeric-owner -C .work/cand-dl/stage -cf - "pi-bolt-$PLAT$SUFFIX" | xz -T0 "${filters[@]}" >".work/cand-dl/pi-bolt-$PLAT$SUFFIX.tar.xz"
          pig="pig-0.5.3-$PIG_PLAT.tar.gz"
          gh release download v0.5.3 --repo MichaelKinsy/PiG --pattern "$pig" --pattern "$pig.sigstore.json" --pattern SHA256SUMS --dir .work/pig-dl
          (cd .work/pig-dl && grep " $pig\$" SHA256SUMS | sha256sum -c -)
          gh attestation verify ".work/pig-dl/$pig" --bundle ".work/pig-dl/$pig.sigstore.json" --repo MichaelKinsy/PiG >/dev/null
          echo "pig: $pig: SHA256SUMS and sigstore bundle verified" >>results/environment.txt
          mkdir -p out/pig && tar -C out/pig --strip-components=1 -xzf ".work/pig-dl/$pig"
          for b in rel rel2 cand; do echo "$b: $(out/$b/pi --version </dev/null)"; done | tee -a results/environment.txt
          echo "pig: $(out/pig/pig --version </dev/null)" | tee -a results/environment.txt
          { echo "runner: ${{ matrix.runner }} ($(uname -srm)), $(nproc) CPUs"; grep -m1 'model name' /proc/cpuinfo || lscpu | grep -m1 'Model name'; echo "python: $(python3 --version), tmux: $(tmux -V)"; } >>results/environment.txt
      - name: Sizes
        env:
          PLAT: ${{ matrix.plat }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          SUFFIX=""; [ "$VARIANT" = jit ] && SUFFIX=-jit
          bytes() { python3 -c "import os,sys; p=sys.argv[1]; print(os.path.getsize(p) if os.path.isfile(p) else sum(os.path.getsize(os.path.join(r,f)) for r,_,fs in os.walk(p) for f in fs if not os.path.islink(os.path.join(r,f))))" "$1"; }
          row() { printf '%-8s %-12s %14s  %s\n' "$1" "$2" "$(bytes "$3")" "$3"; }
          {
            row rel archive.xz ".work/rel-dl/pi-bolt-$PLAT$SUFFIX.tar.xz"
            row rel installed out/rel
            row cand archive.xz ".work/cand-dl/pi-bolt-$PLAT$SUFFIX.tar.xz"
            row cand installed out/cand
            row pig archive.gz .work/pig-dl/pig-0.5.3-*.tar.gz
            row pig installed out/pig
          } | tee results/sizes.txt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Engine tests (tests/aot, tests/runtime, AOT fuzz) on the draft runtime
        if: matrix.variant == 'default'
        continue-on-error: true
        run: |
          set -o pipefail
          f=0
          tests/aot/run.sh 2>&1 | tee results/tests-aot.txt | tail -3 || { echo "tests/aot FAILED" | tee -a results/tests-aot.txt; f=1; }
          tests/runtime/run.sh 2>&1 | tee results/tests-runtime.txt | tail -3 || { echo "tests/runtime FAILED" | tee -a results/tests-runtime.txt; f=1; }
          for m in jit-off jit-on; do timeout 1200 tests/aot/fuzz/run.sh --mode $m --count 300 --jobs 4 2>&1 | tee results/fuzz-$m.txt | tail -3 || { echo "fuzz $m FAILED" | tee -a results/fuzz-$m.txt; f=1; }; done
          ls .work/fuzz/fail 2>/dev/null | head | tee results/fuzz-fail.txt
          exit $f
      - name: Same work
        run: python3 bench/pig_verify.py --build cand=out/cand/pi --build pig=out/pig/pig --build rel=out/rel/pi | tee results/verify.txt
      - name: Suites
        run: |
          CPUS="--cpus 1"
          B=(--build rel=out/rel/pi --build cand=out/cand/pi --build pig=out/pig/pig --build rel2=out/rel2/pi)
          run() { name=$1; out=$2; shift 2; echo "## $name" | tee -a results/all.txt; "$@" 2>&1 | grep -vE 'round [0-9]+/' | tee -a results/all.txt "results/$out" || echo "$name failed" | tee -a results/all.txt; }
          run "gc headless (piped)" gc-headless.txt python3 bench/c2_gc.py --bench bench --mode headless --runs 3 --build rel=out/rel/pi --build cand=out/cand/pi --json results/gc.jsonl
          run "gc interactive first collection" gc-interactive.txt python3 bench/c2_gc.py --bench bench --mode interactive --runs 2 --build rel=out/rel/pi --build cand=out/cand/pi --json results/gc.jsonl
          run benchmark benchmark.txt python3 bench/benchmark.py --runs 21 --warmup 3 $CPUS "${B[@]}" --baseline rel --out results/benchmark.jsonl
          for i in 1 2; do run "long_answer $i" "long_answer-$i.txt" python3 bench/long_answer.py --sizes 20000,60000 $CPUS "${B[@]}"; done
          run idle idle.txt python3 bench/idle.py --seconds 20 --rounds 1 "${B[@]}"
          run "idle 150 s" idle-150.txt python3 bench/idle.py --seconds 150 --rounds 1 "${B[@]}"
          run "idle gc log" gc-idle.txt python3 bench/c2_gc.py --bench bench --mode idle --seconds 150 --rounds 1 --build rel=out/rel/pi --build cand=out/cand/pi --json results/gc.jsonl
          run long_transcript long_transcript.txt python3 bench/long_transcript.py --entries 0,2292,4000 --mode fullscreen,regular --rounds 1 $CPUS "${B[@]}" --json results/long_transcript.jsonl
          for i in 1; do run "long_session $i" "long_session-$i.txt" python3 bench/long_session.py --prompts 40 --every 20 $CPUS "${B[@]}" --out results/long.jsonl; done
          if [ "${{ matrix.variant }}" = jit ] && [ "${{ matrix.plat }}" = linux-x64 ]; then
            run "w12 jit plugin" w12.txt python3 bench/w12_jitbench.py bench rel=out/rel/pi cand=out/cand/pi --runs 5 --out results/w12.jsonl
          fi
          { echo '```'; cat results/environment.txt results/sizes.txt results/verify.txt results/all.txt | awk '/^## /{m=0} /^--- medians/{m=1} m || !/^\{/'; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-${{ matrix.plat }}-${{ matrix.variant }}
          path: results/
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # (Stock Bun: the reference tests\aot compares the compiled programs' output with.)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Builds
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN: "40182788459"
          RTSHA: 469bf2464de0ee3e29d01dee5f42e6dac4a6bae2d3f8a4ea58595a5f5bb7e34b
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force results, .work | Out-Null
          $env_lines = @()
          function Check-Sum($dir, $file) {
            $sum = (Get-FileHash "$dir\$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content -LiteralPath "$dir\SHA256SUMS") -notcontains "$sum  $file") { throw "$file is not the one SHA256SUMS lists" }
          }
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) {
            $shim = Join-Path $env:RUNNER_TEMP 'py-shim'
            New-Item -ItemType Directory -Force $shim | Out-Null
            Set-Content -Encoding ascii (Join-Path $shim 'py.cmd') "@if `"%~1`"==`"-3`" (python %2 %3 %4 %5 %6 %7 %8 %9) else (python %*)"
            $env:PATH = "$shim;$env:PATH"
            Add-Content -Encoding utf8 $env:GITHUB_PATH $shim
          }
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          gh release download bolt-v1.0.2 --repo $env:GITHUB_REPOSITORY --pattern pi-bolt-win32-x64.zip --pattern pi-bolt-win32-x64-jit.zip --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir .work\rel-dl --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $openssl pkeyutl -verify -pubin -inkey keys\release.pub -rawin -in .work\rel-dl\SHA256SUMS -sigfile .work\rel-dl\SHA256SUMS.sig
          if ($LASTEXITCODE -ne 0) { throw "bolt-v1.0.2's signature does not verify" }
          if ((Get-Content .work\rel-dl\SHA256SUMS)[0] -ne '# pi-bolt 1.0.2') { throw "the checksums are not 1.0.2's" }
          foreach ($v in @(@('rel', 'pi-bolt-win32-x64'), @('relj', 'pi-bolt-win32-x64-jit'))) {
            Check-Sum .work\rel-dl "$($v[1]).zip"
            Expand-Archive ".work\rel-dl\$($v[1]).zip" -DestinationPath ".work\x-$($v[0])" -Force
            $exe = Get-ChildItem -Recurse ".work\x-$($v[0])" -Filter pi-bolt.exe | Select-Object -First 1
            Move-Item $exe.Directory.FullName ".work\$($v[0])"
          }
          $env_lines += "rel, relj: pi-bolt-win32-x64[-jit].zip of bolt-v1.0.2 (SHA256SUMS signature and sums verified)"
          New-Item -ItemType Directory -Force .work\rt, .work\runtime | Out-Null
          gh run download $env:RUNTIME_RUN --repo $env:GITHUB_REPOSITORY --name runtime-win32-x64 --dir .work\rt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-FileHash .work\rt\pi-bolt-runtime-win32-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:RTSHA) { throw "runtime is not the draft's" }
          Expand-Archive .work\rt\pi-bolt-runtime-win32-x64.zip -DestinationPath .work\rt -Force
          Copy-Item .work\rt\pi-bolt-runtime-win32-x64\bun.exe .work\runtime\bun.exe
          Set-Content -Encoding ascii .work\runtime\RUNTIME_STAMP '4c59468c0c4b8d3f'
          $env_lines += "runtime: run $($env:RUNTIME_RUN) (= bolt-v1.0.3 draft asset, sha256 $($env:RTSHA)), $(& .work\runtime\bun.exe --version)"
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run build:offline
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($v in @(@('cand', 'off'), @('candj', 'on'))) {
            & scripts\build-pi.ps1 -Jit $v[1] -Out "out\$($v[0])"
            if ($LASTEXITCODE -ne 0) { throw "build-pi.ps1 failed for $($v[0])" }
            Copy-Item -Recurse "out\$($v[0])" ".work\$($v[0])"
            Move-Item ".work\$($v[0])\pi.exe" ".work\$($v[0])\pi-bolt.exe"
            Copy-Item LICENSE, THIRD_PARTY_NOTICES.md ".work\$($v[0])"
            New-Item -ItemType Directory -Force ".work\$($v[0])-dl" | Out-Null
            Compress-Archive -Path ".work\$($v[0])" -DestinationPath ".work\$($v[0])-dl\pi-bolt.zip" -CompressionLevel Optimal
          }
          $pig = 'pig-0.5.3-windows-amd64.zip'
          gh release download v0.5.3 --repo MichaelKinsy/PiG --pattern $pig --pattern "$pig.sigstore.json" --pattern SHA256SUMS --dir .work\pig-dl --clobber
          Check-Sum .work\pig-dl $pig
          gh attestation verify ".work\pig-dl\$pig" --bundle ".work\pig-dl\$pig.sigstore.json" --repo MichaelKinsy/PiG | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "PiG's attestation does not verify" }
          Expand-Archive ".work\pig-dl\$pig" -DestinationPath .work\pig-x -Force
          $pigexe = Get-ChildItem -Recurse .work\pig-x -Filter pig.exe | Select-Object -First 1
          Move-Item $pigexe.Directory.FullName .work\pig
          foreach ($b in 'rel', 'relj', 'cand', 'candj') { $env_lines += "${b}: $(& .work\$b\pi-bolt.exe --version | Select-Object -First 1)" }
          $env_lines += "pig: $(& .work\pig\pig.exe --version | Select-Object -First 1)"
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $env_lines += "runner: windows-2025, $($cpu.Name.Trim()), $($cpu.NumberOfLogicalProcessors) threads"
          $env_lines
          [IO.File]::WriteAllLines("$PWD\results\environment.txt", [string[]]$env_lines)
          function Bytes($p) { if (Test-Path -PathType Leaf $p) { (Get-Item $p).Length } else { (Get-ChildItem -Recurse -File $p | Measure-Object -Sum Length).Sum } }
          $rows = @()
          foreach ($r in @(@('rel', '.work\rel-dl\pi-bolt-win32-x64.zip'), @('relj', '.work\rel-dl\pi-bolt-win32-x64-jit.zip'), @('cand', '.work\cand-dl\pi-bolt.zip'), @('candj', '.work\candj-dl\pi-bolt.zip'), @('pig', ".work\pig-dl\$pig"))) { $rows += "{0,-8} archive {1,14}" -f $r[0], (Bytes $r[1]) }
          foreach ($b in 'rel', 'relj', 'cand', 'candj', 'pig') { $rows += "{0,-8} installed {1,14}" -f $b, (Bytes ".work\$b") }
          $rows
          [IO.File]::WriteAllLines("$PWD\results\sizes.txt", [string[]]$rows)
      - name: Self tests
        continue-on-error: true
        run: |
          $failed = 0
          foreach ($b in 'cand', 'candj') {
            $exe = (Resolve-Path "out\$b\pi.exe").Path
            & tests\pi\run.ps1 $exe *>&1 | Tee-Object -Append $env:GITHUB_WORKSPACE\results\tests-pi.txt
            if ($LASTEXITCODE -ne 0) { "tests\pi FAILED for $b" | Tee-Object -Append $env:GITHUB_WORKSPACE\results\tests-pi.txt; $failed = 1 }
            & scripts\windows-selftest.ps1 -Pi $exe *>&1 | Tee-Object -Append $env:GITHUB_WORKSPACE\results\selftest.txt
            if ($LASTEXITCODE -ne 0) { "selftest FAILED for $b" | Tee-Object -Append $env:GITHUB_WORKSPACE\results\selftest.txt; $failed = 1 }
          }
          & tests\aot\run.ps1 *>&1 | Tee-Object $env:GITHUB_WORKSPACE\results\tests-aot.txt
          if ($LASTEXITCODE -ne 0) { "tests\aot FAILED" | Tee-Object -Append $env:GITHUB_WORKSPACE\results\tests-aot.txt; $failed = 1 }
          & tests\runtime\run.ps1 *>&1 | Tee-Object $env:GITHUB_WORKSPACE\results\tests-runtime.txt
          if ($LASTEXITCODE -ne 0) { "tests\runtime FAILED" | Tee-Object -Append $env:GITHUB_WORKSPACE\results\tests-runtime.txt; $failed = 1 }
          exit $failed
      - name: Suites
        if: always()
        run: |
          $env:PYTHONUTF8 = '1'
          $ErrorActionPreference = 'Continue'
          $B = @('--build', "rel=$PWD\.work\rel\pi-bolt.exe", '--build', "cand=$PWD\.work\cand\pi-bolt.exe", '--build', "pig=$PWD\.work\pig\pig.exe", '--build', "relj=$PWD\.work\relj\pi-bolt.exe", '--build', "candj=$PWD\.work\candj\pi-bolt.exe")
          function Run($name, $file, [string[]]$cmd) {
            "## $name" | Add-Content -Encoding utf8 results\all.txt
            $out = & python @cmd 2>&1 | ForEach-Object { "$_" } | Where-Object { $_ -notmatch 'round [0-9]+/' }
            if ($LASTEXITCODE -ne 0) { $out += "$name failed (exit $LASTEXITCODE)" }
            $out
            [IO.File]::WriteAllLines("$PWD\results\$file", [string[]]@($out))
            $out | Add-Content -Encoding utf8 results\all.txt
          }
          Run verify verify.txt (@('bench\pig_verify.py') + $B)
          Run e2e_tools e2e_tools.txt @('bench\e2e_tools.py', '--reference', "rel=$PWD\.work\rel\pi-bolt.exe", '--build', "cand=$PWD\.work\cand\pi-bolt.exe", '--build', "candj=$PWD\.work\candj\pi-bolt.exe")
          Run benchmark benchmark.txt (@('bench\benchmark.py', '--runs', '21', '--warmup', '3', '--baseline', 'rel', '--out', 'results\benchmark.jsonl') + $B)
          Run "idle 150 s" idle-150.txt (@('bench\idle.py', '--seconds', '150', '--rounds', '1') + $B)
          foreach ($i in 1) { Run "long_answer $i" "long_answer-$i.txt" (@('bench\long_answer.py', '--sizes', '20000,60000') + $B) }
          Run "long_session" long_session-1.txt (@('bench\long_session.py', '--prompts', '40', '--every', '20', '--out', 'results\long.jsonl') + $B)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-win32-x64
          path: results
          retention-days: 14
